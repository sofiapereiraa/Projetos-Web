<link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <h1>Digite o número e confirme para gerar a tabuada</h1>

  <form id="multi">

    <div id="multi2">
      
      <div class="form">
        <label for="num">Tabuada do:</label>
        <input type="number" name="num" id="num" placeholder="3">
      </div>

      <div class="form">
        <label for="num2">Multiplicador:</label>
        <input type="number" name="num2" id="num2" value="10">
      </div>

    </div>

    <input type="submit" value="Calcular">

  </form>

  <div id="mult2">
    <h1 id="titulo-tabuada">
      Tabuada do número: <span></span>
    </h1>

    <div id="op">
      <p>Informe um número para gerar a tabuada.</p>
      <div class="row"></div>
      <div class="op2"> </div>
      <div class="result"></div>
    </div>
  </div>

</body>
